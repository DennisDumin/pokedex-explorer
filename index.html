<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex Explorer</title>
    <script type="module" src="/src/main.js"></script>
    <link rel="icon" type="image/x-icon" href="./img/pokeball.png" />
  </head>

  <body>
    <header>
      <div class="header-logo">
        <img src="./img/pokeball.png" width="62" height="62" alt="" aria-hidden="true" />
        <h1>Pokédex</h1>
      </div>
      <div class="search">
        <form id="pokemon-search-form" role="search">
          <div class="inputWithReset">
            <label class="visually-hidden" for="Search_Pokemon"
              >Search loaded Pokémon</label
            >
            <input
              type="search"
              placeholder="Search loaded Pokémon..."
              id="Search_Pokemon"
              autocomplete="off"
            />
            <button type="reset" id="Reset_Btn" aria-label="Clear Pokémon search" hidden>
              ×
            </button>
          </div>
          <p id="filterMessage" role="status" aria-live="polite"></p>
        </form>
      </div>
    </header>

    <main>
      <section class="show-all-pokemon" aria-label="Loaded Pokémon">
        <div id="pokemon-card" class="pokemon-card-section"></div>
      </section>

      <div class="load-button-section">
        <button id="load-more-button" class="load-more-button" type="button">
          Load 20 more Pokémon
        </button>
      </div>
    </main>

    <dialog id="pokemon-dialog" class="pokemon-dialog" aria-label="Pokémon details">
      <div id="show-big-card"></div>
    </dialog>

    <div
      id="request-error"
      class="request-error"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
      hidden
    >
      <p id="request-error-message"></p>
      <button id="request-retry-button" type="button" hidden>Try again</button>
    </div>

    <div id="overlay" aria-hidden="true">
      <div
        id="loader"
        role="status"
        aria-live="polite"
        aria-label="Loading Pokemon data"
        aria-atomic="true"
      >
        <img src="./img/pokeball-icon.svg" alt="" aria-hidden="true" />
        <p id="loading-dots" aria-hidden="true">Loading...</p>
      </div>
    </div>
  </body>
</html>
